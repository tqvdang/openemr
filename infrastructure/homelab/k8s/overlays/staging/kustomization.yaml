apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: openemr-staging

resources:
- ../../base
- configmap.yaml
- secrets.yaml
- nodeport-service.yaml
# PT Configuration
- pt-configmap.yaml
- pt-sql-configmap.yaml
- pt-setup-job.yaml

labels:
- pairs:
    environment: staging

patches:
# Add site address for OAuth
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: OPENEMR_SETTING_site_addr_oath
        value: "https://openemr-staging.trancloud.work"
  target:
    kind: Deployment
    name: openemr

# Mount sqlconf.php template and copy during init for consistent deployments
- patch: |-
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: sqlconf-template
        configMap:
          name: openemr-pt-config
          items:
          - key: sqlconf.php
            path: sqlconf.php
    - op: replace
      path: /spec/template/spec/initContainers/0/command
      value:
        - sh
        - -c
        - |
          if [ ! -d /sites/default ]; then
            echo "Creating sites directory structure..."
            mkdir -p /sites/default/documents/logs
            mkdir -p /sites/default/images
            mkdir -p /sites/default/certs
          fi
          # Always copy the sqlconf.php template to ensure correct format
          echo "Copying sqlconf.php template..."
          cp /sqlconf-template/sqlconf.php /sites/default/sqlconf.php
          chmod 666 /sites/default/sqlconf.php
          echo "Sites directory initialized with sqlconf.php"
          ls -la /sites/default/
    - op: add
      path: /spec/template/spec/initContainers/0/volumeMounts/-
      value:
        name: sqlconf-template
        mountPath: /sqlconf-template
        readOnly: true
  target:
    kind: Deployment
    name: openemr

# PT menu customization - simplified menu for PT workflow
- patch: |-
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: pt-menu-source
        configMap:
          name: openemr-pt-config
          items:
          - key: menu-standard.json
            path: standard.json
    - op: add
      path: /spec/template/spec/volumes/-
      value:
        name: pt-menu
        emptyDir: {}
    - op: add
      path: /spec/template/spec/initContainers/-
      value:
        name: copy-pt-menu
        image: busybox
        command: ['sh', '-c', 'cp /menu-source/standard.json /menu/standard.json && chmod 644 /menu/standard.json']
        volumeMounts:
        - name: pt-menu-source
          mountPath: /menu-source
        - name: pt-menu
          mountPath: /menu
    - op: add
      path: /spec/template/spec/containers/0/volumeMounts/-
      value:
        name: pt-menu
        mountPath: /var/www/localhost/htdocs/openemr/interface/main/tabs/menu/menus/standard.json
        subPath: standard.json
  target:
    kind: Deployment
    name: openemr
