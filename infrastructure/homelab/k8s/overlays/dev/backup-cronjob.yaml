apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openemr-backups
  labels:
    app: openemr
    component: backup
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openemr-db-backup
  labels:
    app: openemr
    component: backup
spec:
  # Run daily at 2 AM
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: backup
            image: mariadb:10.11
            command:
            - /bin/bash
            - -c
            - |
              set -e
              TIMESTAMP=$(date +%Y%m%d_%H%M%S)
              BACKUP_FILE="/backups/openemr_dev_${TIMESTAMP}.sql.gz"

              echo "Starting backup at $(date)"

              # Create backup with compression
              mariadb-dump \
                -h ${DB_HOST} \
                -u ${DB_USER} \
                -p${DB_PASS} \
                --ssl \
                --ssl-verify-server-cert=0 \
                --single-transaction \
                --routines \
                --triggers \
                --events \
                ${DB_NAME} | gzip > ${BACKUP_FILE}

              echo "Backup created: ${BACKUP_FILE}"
              ls -lh ${BACKUP_FILE}

              # Keep only last 7 days of backups
              find /backups -name "openemr_dev_*.sql.gz" -mtime +7 -delete

              echo "Current backups:"
              ls -lh /backups/

              echo "Backup completed at $(date)"
            env:
            - name: DB_HOST
              value: "openemr-db.trancloud.work"
            - name: DB_NAME
              value: "openemr_dev"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: openemr-db-credentials
                  key: root-username
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: openemr-db-credentials
                  key: root-password
            volumeMounts:
            - name: backups
              mountPath: /backups
            - name: ssl-ca
              mountPath: /etc/ssl/mariadb
              readOnly: true
          restartPolicy: OnFailure
          volumes:
          - name: backups
            persistentVolumeClaim:
              claimName: openemr-backups
          - name: ssl-ca
            secret:
              secretName: mariadb-ssl-ca
---
# Secret for root credentials (update with your values)
apiVersion: v1
kind: Secret
metadata:
  name: openemr-db-credentials
  labels:
    app: openemr
    component: backup
type: Opaque
stringData:
  root-username: "root"
  root-password: "ycm&17XK"
