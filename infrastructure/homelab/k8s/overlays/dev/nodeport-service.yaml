apiVersion: v1
kind: Service
metadata:
  name: openemr-nodeport
  namespace: openemr-dev
  labels:
    app: openemr
    component: web
spec:
  type: NodePort
  selector:
    app: openemr
    component: web
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30090  # External access port (available in 30000-32767 range)
    protocol: TCP
