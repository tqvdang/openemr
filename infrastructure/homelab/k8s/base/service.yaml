apiVersion: v1
kind: Service
metadata:
  name: openemr
  labels:
    app: openemr
    component: web
spec:
  type: ClusterIP
  selector:
    app: openemr
    component: web
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
  - name: https
    port: 443
    targetPort: 443
    protocol: TCP
