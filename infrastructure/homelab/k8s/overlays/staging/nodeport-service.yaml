apiVersion: v1
kind: Service
metadata:
  name: openemr-nodeport
  namespace: openemr-staging
  labels:
    app: openemr
    component: web
spec:
  type: NodePort
  selector:
    app: openemr
    component: web
  ports:
  - name: http
    port: 80
    targetPort: 80
    nodePort: 30091  # Staging port
    protocol: TCP
