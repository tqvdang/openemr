  # PT setup script - runs SQL migrations
  pt-setup.sh: |
    #!/bin/bash
    set -e

    echo "=== Vietnamese PT Configuration Setup ==="
    echo "Waiting for database to be ready..."

    # Wait for MySQL/MariaDB to be available
    until mariadb -h "$MYSQL_HOST" -u root -p"$MYSQL_ROOT_PASS" --ssl --ssl-verify-server-cert=0 -e "SELECT 1" > /dev/null 2>&1; do
      echo "Waiting for database..."
      sleep 5
    done

    DB_NAME="${MYSQL_DATABASE:-openemr_dev}"

    echo "Applying PT configuration to database: $DB_NAME"

    # Apply SQL migrations
    for sql_file in /etc/openemr/pt-config/*.sql; do
      if [ -f "$sql_file" ]; then
        echo "Applying: $(basename $sql_file)"
        mariadb -h "$MYSQL_HOST" -u root -p"$MYSQL_ROOT_PASS" --ssl --ssl-verify-server-cert=0 "$DB_NAME" < "$sql_file"
      fi
    done

    # Copy custom menu JSON
    if [ -f "/etc/openemr/pt-config/menu-standard.json" ]; then
      echo "Installing custom PT menu..."
      cp /etc/openemr/pt-config/menu-standard.json /var/www/localhost/htdocs/openemr/interface/main/tabs/menu/menus/standard.json
      chown apache:apache /var/www/localhost/htdocs/openemr/interface/main/tabs/menu/menus/standard.json
    fi

    echo "=== PT Configuration Complete ==="
